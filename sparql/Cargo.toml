[package]
name = "sophia_sparql"
description = "A Rust toolkit for RDF and Linked Data - SPARQL query language"
documentation = "https://docs.rs/sophia_sparql"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true

[package.metadata.docs.rs]
all-features = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sophia_api.workspace = true
sophia_inmem.workspace = true
sophia_iri.workspace = true
sophia_term.workspace = true
base16ct = { workspace = true }
bigdecimal = { workspace = true }
chrono = { workspace = true, features = ["alloc"] }
log.workspace = true
num-bigint = { workspace = true }
oxiri.workspace = true
oxrdf.workspace = true
rand = { workspace = true }
regex.workspace = true
resiter.workspace = true
spargebra = { workspace = true, features = ["sparql-12"] }
thiserror.workspace = true
uuid = { workspace = true, features = ["v4", "v7"] }
md5 = { workspace = true }
sha1 = { workspace = true }
sha2.workspace = true

[dev-dependencies]
sophia_turtle.workspace = true
sophia_isomorphism.workspace = true
test-case.workspace = true
